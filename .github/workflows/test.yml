name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import aicli"
          python -c "import aicli.providers.pipeline"
          python -c "import aicli.context.manager"
          python -c "import aicli.handlers.default"
          python -c "import aicli.handlers.chat"
          python -c "import aicli.handlers.repl"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          AICLI_TEST_MODE: "1"

      - name: Check CLI entry point
        run: |
          pip install -e .
          aicli --version
