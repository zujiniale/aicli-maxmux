[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicli-maxmux"
version = "1.1.0"
description = "Free, private, async CLI AI tool with multi-provider failover"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "tiktoken>=0.7.0",
    "pytest>=9.0.0",
]

[project.scripts]
aicli = "aicli.app:main"

[project.optional-dependencies]
full = [
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]
rag = [
    "chromadb>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aicli"]

[tool.hatch.build.targets.sdist]
exclude = [
    "venv/",
    ".venv/",
    "dist/",
    ".pytest_cache/",
    "__pycache__/",
    "*.pyc",
    ".env",
    "expandedPROJECT_MAP.txt",
    "retractedPROJECT_MAP.txt",
]
