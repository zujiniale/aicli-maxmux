[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicli-maxmux"
version = "1.5.0"
description = "Free, private, terminal-native AI CLI with multi-provider failover, persistent memory, web search, vision, TUI, session graph, and plugin system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "tiktoken>=0.7.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aicli = "aicli.app:main"

[project.optional-dependencies]
full = [
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
]
tui = [
    "textual>=0.89",
]
proxy = [
    "pysocks>=1.7",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "textual>=0.89",
    "pysocks>=1.7",
    "twine>=5.0",
    "build>=1.2",
    "ruff>=0.4",
]
all = [
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "textual>=0.89",
    "pysocks>=1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["aicli"]
omit = ["tests/*", "exports/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hatch.build.targets.wheel]
packages = ["aicli"]

[tool.hatch.build.targets.sdist]
exclude = [
    "venv/",
    ".venv/",
    "dist/",
    ".pytest_cache/",
    "__pycache__/",
    "*.pyc",
    ".env",
    "expandedPROJECT_MAP.txt",
    "retractedPROJECT_MAP.txt",
]
